<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JPrinter3D" />
    <meta name="description" content="Calculadora y generador de cotizaciones para impresiones 3D, con exportación a PDF y diseño listo para móvil." />
    <meta name="application-name" content="JPrinter3D" />
    <link rel="icon" type="image/png" href="./favicon-32.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('jprinter3d:theme');
          const theme = stored || 'light';
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>JPrinter3D | Calculadora de cotizaciones</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
